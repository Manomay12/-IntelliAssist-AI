# Render Blueprint Specification for IntelliAssist AI
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: intelliassist-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: ./build.sh
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.enableCORS false --server.enableXsrfProtection true
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_SERVER_PORT
        fromService:
          type: web
          name: intelliassist-ai
          property: port
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: DEFAULT_LLM_PROVIDER
        value: Google Gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
